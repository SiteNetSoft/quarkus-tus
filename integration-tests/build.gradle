plugins {
    id 'io.quarkus'
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation project(':runtime')
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-vertx'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
}

tasks.named('test') {
    exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
    description = 'Runs @QuarkusIntegrationTest tests against the packaged JAR'
    group = 'verification'
    dependsOn tasks.named('quarkusBuild')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class'
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
}

tasks.register('nativeIntegrationTest', Test) {
    description = 'Runs @QuarkusIntegrationTest tests against the native binary'
    group = 'verification'
    dependsOn tasks.named('quarkusBuild')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class'
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
    systemProperty 'quarkus.native.enabled', 'true'
}
