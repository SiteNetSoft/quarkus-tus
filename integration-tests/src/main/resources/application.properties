quarkus.tus.sse-enabled=true
quarkus.tus.auth-enabled=false
quarkus.tus.max-size=104857600
quarkus.tus.max-chunk-size=1024
quarkus.tus.expiration-hours=1
quarkus.tus.store.local.upload-dir=${java.io.tmpdir}/quarkus-tus-it-uploads

# Dev mode only: the test values above are deliberately tiny (1 KB chunks) to exercise limits.
# The manual console at http://localhost:8080/ needs workable ones. Tests are unaffected.
%dev.quarkus.tus.max-chunk-size=5242880
%dev.quarkus.tus.expiration-hours=24
%dev.quarkus.tus.store.local.upload-dir=${java.io.tmpdir}/quarkus-tus-dev-uploads
