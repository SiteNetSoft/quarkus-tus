plugins {
    id 'io.quarkus.extension'
    // Consumers compile against the SPI (Uni, Multi<Buffer>) and the CDI annotations, so the
    // Quarkus dependencies must reach them at compile scope, as every upstream extension does.
    id 'java-library'
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    api 'io.quarkus:quarkus-arc'
    api 'io.quarkus:quarkus-rest'
    api 'io.quarkus:quarkus-scheduler'
    api 'io.quarkus:quarkus-vertx'

    compileOnly 'io.quarkus:quarkus-micrometer'
    compileOnly 'io.quarkus:quarkus-smallrye-health'
    compileOnly 'org.eclipse.microprofile.openapi:microprofile-openapi-api'

    annotationProcessor enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    annotationProcessor 'io.quarkus:quarkus-extension-processor'
}
