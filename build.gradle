allprojects {
    group = 'org.sitenetsoft'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    // Gradle 10 readiness: use task configuration avoidance APIs
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('compileJava') {
        options.compilerArgs << '-parameters'
    }

    jacoco {
        toolVersion = '0.8.15'
    }

    tasks.named('jacocoTestReport') {
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('test') {
        finalizedBy tasks.named('jacocoTestReport')
    }

    // Note: The remaining Gradle deprecation warning about Task.project at execution time
    // comes from the io.quarkus.extension plugin's validateExtension task and must be fixed
    // upstream in Quarkus. It is not addressable in project code.
}
