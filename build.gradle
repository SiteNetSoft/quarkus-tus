allprojects {
    group = 'org.sitenetsoft'
    version = '1.0.0'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    // Reading HTTP request trailers requires https://github.com/eclipse-vertx/vert.x/issues/5253,
    // which Vert.x does not yet ship. Until it does, the checksum-trailer extension needs a
    // vertx-core built from the request-trailers branch and installed to the local repository.
    configurations.all {
        resolutionStrategy {
            force 'io.vertx:vertx-core:4.5.32-SNAPSHOT'
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    // Gradle 10 readiness: use task configuration avoidance APIs
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('compileJava') {
        options.compilerArgs << '-parameters'
    }

    jacoco {
        toolVersion = '0.8.15'
    }

    tasks.named('jacocoTestReport') {
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('test') {
        finalizedBy tasks.named('jacocoTestReport')
    }

}

// ---- Publishing (runtime, deployment and tck; integration-tests is not published) ----
//
// The Quarkus extension descriptor generated into the runtime jar points at
// org.sitenetsoft:quarkus-tus-deployment, so the published artifact ids must match exactly
// or Quarkus cannot resolve the deployment module at augmentation time.
// Bound to a script-local variable as well: closures below run in the subprojects' scope, and
// Gradle 10 drops the implicit lookup of a parent project's extra properties.
def publishedArtifactIds = [runtime: 'quarkus-tus', deployment: 'quarkus-tus-deployment', tck: 'quarkus-tus-tck',
                            'client-runtime': 'quarkus-tus-client', 'client-deployment': 'quarkus-tus-client-deployment']
ext.publishedArtifactIds = publishedArtifactIds

configure(subprojects.findAll { publishedArtifactIds.containsKey(it.name) }) { proj ->
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    base {
        archivesName = publishedArtifactIds[proj.name]
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    // Quarkus extensions depend on the BOM via enforcedPlatform, which Gradle Module Metadata
    // cannot express. These are consumed as Maven artifacts, so publish the POM only.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    // Central requires a javadoc jar; doclint would fail the build on inherited Quarkus javadoc.
    tasks.named('javadoc') {
        options.addStringOption('Xdoclint:none', '-quiet')
        // The deployment modules expose only package-private build steps, so javadoc finds
        // nothing to document and errors. Central still wants the jar, empty is fine.
        // client-runtime is public API, kept failOnError so real javadoc errors don't slip
        // through unnoticed.
        if (proj.name == 'deployment' || proj.name == 'client-deployment') {
            failOnError = false
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                artifactId = publishedArtifactIds[proj.name]
                pom {
                    name = artifactId
                    description = switch (proj.name) {
                        case 'runtime' -> 'Quarkus extension implementing the TUS resumable upload protocol'
                        case 'tck' -> 'Contract test for UploadStore implementations of the Quarkus TUS extension'
                        case 'client-runtime' -> 'TUS resumable upload client for Quarkus'
                        default -> 'Deployment module for the Quarkus TUS resumable upload extension'
                    }
                    url = 'https://github.com/SiteNetSoft/quarkus-tus'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'jnbdz'
                            name = 'Jean-Nicolas Boulay Desjardins'
                            organization = 'SiteNetSoft'
                            organizationUrl = 'https://github.com/SiteNetSoft'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/SiteNetSoft/quarkus-tus.git'
                        developerConnection = 'scm:git:ssh://git@github.com/SiteNetSoft/quarkus-tus.git'
                        url = 'https://github.com/SiteNetSoft/quarkus-tus'
                    }
                }
            }
        }
        repositories {
            // A local staging layout: upload this directory as a bundle to the Central Portal,
            // or point a release tool at it. No credentials are baked into the build.
            maven {
                name = 'staging'
                url = rootProject.layout.buildDirectory.dir('staging-deploy')
            }
        }
    }

    signing {
        def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
        def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
        // Unsigned local builds stay possible; releases must be signed.
        required = { signingKey != null && !version.toString().endsWith('SNAPSHOT') }
        if (signingKey != null) {
            useInMemoryPgpKeys(signingKey.toString(), signingPassword?.toString())
        }
        sign publishing.publications.maven
    }
}

subprojects {
    // Note: The remaining Gradle deprecation warning about Task.project at execution time
    // comes from the io.quarkus.extension plugin's validateExtension task and must be fixed
    // upstream in Quarkus. It is not addressable in project code.
}
