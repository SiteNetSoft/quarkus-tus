name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Build
        run: ./gradlew build

      - name: Integration tests
        run: ./gradlew :integration-tests:integrationTest

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/reports/tests/
          retention-days: 7

  # Runs on pull requests as well as master. Native image is sensitive to how beans and
  # JAX-RS classes are registered, which is exactly the kind of change that is easy to get
  # wrong and expensive to discover after merging.
  native:
    name: Native Image Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Build and test native image
        run: ./gradlew :integration-tests:nativeIntegrationTest -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false
