name: Release

# Publishes signed artifacts to Maven Central. Triggered by pushing a v* tag.
#
# Native image is deliberately not rebuilt here. Tag pushes do not trigger ci.yml, which runs on
# branches, but a tag points at a commit that already went through it on master. Re-running a
# ten-minute native build would not tell us anything new about the jars being published.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publishing_type:
        description: 'USER_MANAGED holds the deployment in the Portal for review; AUTOMATIC releases it immediately'
        required: true
        default: USER_MANAGED
        type: choice
        options: [ USER_MANAGED, AUTOMATIC ]

# Two tags pushed close together must not race each other into the Portal.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # A manual run is only ever meant for master: dispatching from a branch would publish whatever
    # version that branch's build.gradle declares, and Central does not take it back.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/master'
    env:
      TUS_S3_ENDPOINT: http://localhost:9000

    steps:
      - uses: actions/checkout@v7

      # Same MinIO as ci.yml, so the S3 store suites run here too instead of silently skipping.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Publishing 0.1.0 under a v0.2.0 tag produces artifacts nobody can find and a tag that
      # documents a lie. Neither the build nor the Portal would object, so check it here.
      - name: Check the tag matches the project version
        id: version
        run: |
          VERSION=$(grep -oP "^\s*version = '\K[^']+" build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

          case "$VERSION" in
            *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT version ($VERSION)."; exit 1 ;;
          esac

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match build.gradle version $VERSION."
              exit 1
            fi
            echo "Tag ${GITHUB_REF_NAME} matches."
          fi

      - name: Build and test
        run: ./gradlew build

      - name: Integration tests
        run: ./gradlew :integration-tests:integrationTest

      - name: Verify the S3 store tests ran
        run: |
          results=integration-tests/build/test-results/test
          for suite in TusS3StreamingTest S3UploadStoreContractTest; do
            file="$results/TEST-org.sitenetsoft.quarkus.tus.it.$suite.xml"
            if [ ! -f "$file" ] || ! grep -q 'skipped="0"' "$file"; then
              echo "::error::$suite did not run — MinIO is not reaching the tests"; exit 1
            fi
          done

      - name: Publish signed artifacts to the staging directory
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY is not set. Central rejects unsigned artifacts."
            exit 1
          fi
          ./gradlew publishAllPublicationsToStagingRepository

      # An unsigned or partially signed bundle is accepted by the upload endpoint and fails
      # validation minutes later, so catch it while the log still says why.
      - name: Verify every artifact is signed
        run: |
          cd build/staging-deploy
          MISSING=0
          while IFS= read -r f; do
            [ -f "$f.asc" ] || { echo "unsigned: $f"; MISSING=1; }
          done < <(find . -type f \( -name '*.jar' -o -name '*.pom' \))
          [ "$MISSING" -eq 0 ] || { echo "::error::Some artifacts are unsigned."; exit 1; }
          echo "All jars and POMs are signed."

      - name: Assemble the Central bundle
        run: |
          cd build/staging-deploy
          # maven-metadata.xml is generated for the local repository layout and is not part of a
          # Portal bundle; leaving it in trips validation.
          find . -name 'maven-metadata.xml*' -delete
          zip -qr ../central-bundle.zip .
          echo "Bundle contents:"
          unzip -l ../central-bundle.zip | tail -n +4 | head -20

      - name: Upload to the Central Portal
        id: upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type || 'USER_MANAGED' }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_PASSWORD" ]; then
            echo "::error::CENTRAL_USERNAME / CENTRAL_PASSWORD are not set."
            exit 1
          fi
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          DEPLOYMENT_ID=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $AUTH" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=quarkus-tus-${VERSION}&publishingType=${PUBLISHING_TYPE}")
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment ID: $DEPLOYMENT_ID (publishingType=$PUBLISHING_TYPE)"

      # The upload returns as soon as the bundle is accepted, long before it is validated.
      # Without this the job goes green on a deployment that later fails.
      - name: Wait for validation
        id: validation
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
        run: |
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          for i in $(seq 1 40); do
            BODY=$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")
            STATE=$(echo "$BODY" | grep -oP '"deploymentState"\s*:\s*"\K[^"]+' || echo UNKNOWN)
            echo "[$i] $STATE"
            case "$STATE" in
              PUBLISHED)
                echo "$BODY"
                echo "state=PUBLISHED" >> "$GITHUB_OUTPUT"
                echo "Deployment is published; artifacts appear on Central within a few hours."
                exit 0 ;;
              VALIDATED)
                echo "$BODY"
                echo "state=VALIDATED" >> "$GITHUB_OUTPUT"
                echo "::warning::Deployment is VALIDATED but not published (publishingType=USER_MANAGED). Nothing is on Central until you press Publish at https://central.sonatype.com/publishing/deployments"
                exit 0 ;;
              FAILED)
                echo "$BODY"
                echo "::error::Central validation failed."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for validation. Check https://central.sonatype.com/publishing/deployments"
          exit 1

      - name: Upload the bundle as a build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: build/central-bundle.zip
          retention-days: 30

      # A USER_MANAGED deployment is only validated at this point; the release stays a draft so
      # the tag never announces artifacts that are not yet downloadable. Publish the draft once the
      # Portal deployment is released.
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          STATE: ${{ steps.validation.outputs.state }}
        run: |
          DRAFT=""
          if [ "$STATE" != "PUBLISHED" ]; then
            DRAFT="--draft"
            echo "Deployment state is ${STATE:-unknown}; creating the GitHub release as a draft."
          fi
          gh release create "${GITHUB_REF_NAME}" $DRAFT \
            --title "quarkus-tus ${VERSION}" \
            --generate-notes
