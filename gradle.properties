# Gradle properties

quarkusPluginId=io.quarkus
quarkusPluginVersion=3.38.0
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.38.0

# Resource caps: keep a local build/test run from starving the host.
# (32-core box; unbounded Gradle workers + Quarkus test JVMs were suspected of hard crashes.)
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
